[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Production-grade autonomous AI research and cited report generation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.1.0",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "tavily-python>=0.5.0",
    "streamlit>=1.39.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
